<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - SIGR</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  {% include "_analytics.default.html" %}
</head>
<body>
  <header>
    <nav>
      <a href="/" class="nav-brand">🌐 SIGR</a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/worlds">Worlds</a>
        <a href="/relays">Relays</a>
        <a href="/admin" class="active">Admin</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero-section">
      <h1 class="hero-title">🛠️ Admin Panel</h1>
      <p class="hero-subtitle">Manage relay connections and world visibility</p>
    </section>

    <div class="admin-grid">
      <section class="search-container admin-section">
        <h2 class="admin-section-title">🔗 Follow Relay</h2>
        <form action="/admin/follow" method="post" class="admin-form">
          <div class="form-group">
            <label for="follow_url" class="form-label">Relay URL</label>
            <input type="url" name="follow_url" id="follow_url" class="form-input" 
                   placeholder="https://relay.example.com" required>
          </div>
          <button type="submit" class="tile-button">
            ➕ Follow Relay
          </button>
        </form>
      </section>

      <section class="search-container admin-section">
        <h2 class="admin-section-title">👁️ World Visibility</h2>

        <div style="display:flex;align-items:center;gap:1rem;margin-bottom:0.75rem;flex-wrap:wrap;">
          <label style="display:flex;align-items:center;gap:0.4rem;font-weight:600;cursor:pointer;">
            <input type="checkbox" id="select-all" onchange="toggleSelectAll(this)"> Select all
          </label>
          <button onclick="submitBulkDelete()" class="visibility-button hidden" style="padding:0.3rem 0.8rem;">
            🗑️ Delete Selected
          </button>
        </div>

        <form id="bulk-delete-form" action="/admin/bulk-delete" method="post">
          <input type="hidden" name="app_ids" id="bulk-app-ids">
        </form>

        <div class="app-visibility-list">
          {% for app in apps %}
          <div class="app-visibility-item">
            <div class="app-info">
              <input type="checkbox" class="bulk-checkbox" value="{{ app.id }}" style="margin-right:0.4rem;flex-shrink:0;">
              <span class="app-id">#{{ app.id }}</span>
              <div style="display:flex;flex-direction:column;gap:0.1rem;min-width:0;">
                <span style="font-weight:600;">{{ app.name }}</span>
                <a class="app-url" href="{{ app.url }}" target="_blank" rel="noopener noreferrer" title="{{ app.url }}" style="word-break:break-all;">{{ app.url }}</a>
              </div>
            </div>
            <div style="display:flex;gap:0.5rem;align-items:center;">
              <form action="/admin/set-content-type" method="post" class="visibility-form">
                <input type="hidden" name="app_id" value="{{ app.id }}">
                <select name="content_type" onchange="this.form.submit()" style="padding:0.3rem 0.5rem;border-radius:6px;border:1px solid #ccc;font-size:0.85rem;">
                  <option value="world" {% if app.content_type == "world" %}selected{% endif %}>🌐 World</option>
                  <option value="page" {% if app.content_type == "page" %}selected{% endif %}>📄 Page</option>
                  <option value="profile" {% if app.content_type == "profile" %}selected{% endif %}>👤 Profile</option>
                </select>
              </form>
              <form action="/admin/togglevisible" method="post" class="visibility-form">
                {% if app.visible %}
                  <button type="submit" name="app_id" value="{{ app.id }}"
                          class="visibility-button visible">
                    ✅ Visible
                  </button>
                {% else %}
                  <button type="submit" name="app_id" value="{{ app.id }}"
                          class="visibility-button hidden">
                    ❌ Hidden
                  </button>
                {% endif %}
              </form>
              <form action="/admin/delete-world" method="post" class="visibility-form"
                    onsubmit="return confirm('Delete world #{{ app.id }} ({{ app.url }})? This cannot be undone.');">
                <button type="submit" name="app_id" value="{{ app.id }}"
                        class="visibility-button hidden">
                  🗑️ Delete
                </button>
              </form>
            </div>
          </div>
          {% endfor %}
        </div>
      </section>
    </div>
  </main>

  <script>
    function toggleSelectAll(source) {
      document.querySelectorAll('.bulk-checkbox').forEach(cb => cb.checked = source.checked);
    }

    function submitBulkDelete() {
      const checked = [...document.querySelectorAll('.bulk-checkbox:checked')];
      if (checked.length === 0) { alert('No worlds selected.'); return; }
      if (!confirm(`Delete ${checked.length} world(s)? This cannot be undone.`)) return;
      document.getElementById('bulk-app-ids').value = checked.map(cb => cb.value).join(',');
      document.getElementById('bulk-delete-form').submit();
    }
  </script>
</body>
</html>
